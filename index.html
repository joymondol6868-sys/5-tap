<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Watch</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#f2f2f7;--card:#fff;--accent:#007aff;--accent2:#5856d6;
  --text:#1c1c1e;--sub:#6d6d72;--border:#e5e5ea;--green:#34c759;--radius:16px;
}
body{font-family:-apple-system,'SF Pro Display','Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}

/* LOADING */
#loadingScreen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:999;transition:opacity 0.3s;}
.loader-ring{width:44px;height:44px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loader-text{font-size:14px;color:var(--sub);font-weight:500;}

/* ERROR */
#errorScreen{display:none;padding:60px 24px;text-align:center;}
.error-emoji{font-size:52px;margin-bottom:16px;}
.error-title{font-size:18px;font-weight:700;margin-bottom:8px;}
.error-sub{font-size:14px;color:var(--sub);line-height:1.5;}

/* MAIN SCREEN */
#mainScreen{display:none;padding-bottom:30px;}

/* THUMBNAIL */
.thumb-wrap{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden;}
.thumb-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
.thumb-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 40%,rgba(0,0,0,0.65) 100%);}
.play-btn-overlay{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:64px;height:64px;background:rgba(255,255,255,0.2);backdrop-filter:blur(10px);border:2px solid rgba(255,255,255,0.5);border-radius:50%;display:flex;align-items:center;justify-content:center;pointer-events:none;}
.play-btn-overlay svg{width:28px;height:28px;fill:white;margin-left:4px;}
.duration-pill{position:absolute;bottom:12px;right:12px;background:rgba(0,0,0,0.6);backdrop-filter:blur(8px);color:#fff;font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px;display:flex;align-items:center;gap:5px;}

/* INFO */
.info-card{background:var(--card);margin:12px 12px 10px;border-radius:var(--radius);padding:16px;box-shadow:0 2px 12px rgba(0,0,0,0.07);}
.video-title{font-size:16px;font-weight:700;line-height:1.35;margin-bottom:10px;}
.meta-row{display:flex;gap:14px;flex-wrap:wrap;}
.meta-item{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--sub);font-weight:500;}
.meta-item svg{width:13px;height:13px;flex-shrink:0;}

/* UNLOCK CARD */
.unlock-card{background:var(--card);margin:0 12px 10px;border-radius:var(--radius);padding:22px 18px;box-shadow:0 2px 12px rgba(0,0,0,0.07);text-align:center;}
.unlock-steps{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:18px;}
.step-dot{width:28px;height:6px;border-radius:3px;background:var(--border);transition:background 0.3s;}
.step-dot.active{background:var(--accent);}
.step-dot.done{background:var(--green);}
.unlock-icon{width:56px;height:56px;background:linear-gradient(135deg,#007aff,#5856d6);border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:26px;}
.unlock-title{font-size:17px;font-weight:700;color:var(--text);margin-bottom:6px;}
.unlock-sub{font-size:13px;color:var(--sub);line-height:1.5;margin-bottom:20px;}
.status-badge{display:none;align-items:center;justify-content:center;gap:6px;border-radius:10px;padding:10px 14px;font-size:13px;font-weight:600;margin-bottom:16px;}
.status-badge.success{background:rgba(52,199,89,0.1);border:1px solid rgba(52,199,89,0.25);color:var(--green);}
.status-badge.error{background:rgba(255,59,48,0.1);border:1px solid rgba(255,59,48,0.25);color:#ff3b30;}
.btn-unlock{width:100%;padding:15px;background:linear-gradient(135deg,#007aff,#5856d6);border:none;border-radius:13px;color:#fff;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 18px rgba(0,122,255,0.3);transition:opacity 0.2s,transform 0.1s;}
.btn-unlock:active{opacity:0.85;transform:scale(0.98);}
.btn-unlock:disabled{opacity:0.55;cursor:not-allowed;transform:none;}

.close-card{margin:0 12px 10px;}
.btn-close-app{width:100%;padding:14px;background:var(--card);border:1.5px solid var(--border);border-radius:13px;color:var(--text);font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 2px 12px rgba(0,0,0,0.07);}
.btn-close-app:active{background:var(--border);}

/* FULLSCREEN VIDEO PLAYER */
#playerScreen{display:none;position:fixed;inset:0;background:#000;z-index:500;flex-direction:column;align-items:center;justify-content:center;}
#mainVideo{width:100%;height:98%;object-fit:contain;display:block;background:#000;}
.vp-spinner{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:48px;height:48px;border:3px solid rgba(255,255,255,0.2);border-top-color:#fff;border-radius:50%;animation:spin 0.8s linear infinite;display:none;pointer-events:none;z-index:10;}
.vp-tap{position:absolute;inset:0;z-index:6;}
.vp-overlay{position:absolute;inset:0;z-index:7;display:flex;flex-direction:column;justify-content:space-between;opacity:0;pointer-events:none;transition:opacity 0.25s;}
.vp-overlay.visible{opacity:1;pointer-events:all;}
.vp-seek-area{padding:16px 16px 0;}
.vp-seek-track{width:100%;height:4px;background:rgba(255,255,255,0.3);border-radius:2px;position:relative;cursor:pointer;}
.vp-seek-fill{height:100%;width:0%;background:#fff;border-radius:2px;}
.vp-seek-thumb{position:absolute;top:50%;width:14px;height:14px;background:#fff;border-radius:50%;transform:translate(-50%,-50%);left:0%;box-shadow:0 1px 4px rgba(0,0,0,0.5);}
.vp-time-row{display:flex;justify-content:space-between;padding:6px 4px 0;font-size:11px;font-weight:600;color:rgba(255,255,255,0.8);}
.vp-center{display:flex;align-items:center;justify-content:center;}
.vp-play-btn{width:64px;height:64px;background:rgba(0,0,0,0.45);border:none;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(8px);border:1.5px solid rgba(255,255,255,0.25);}
.vp-play-btn svg{width:28px;height:28px;fill:#fff;margin-left:3px;}
.vp-play-btn.pause svg{margin-left:0;}
.vp-close-wrap{position:absolute;bottom:28px;left:0;right:0;display:flex;justify-content:center;z-index:20;}
.vp-close-btn{background:rgba(0,0,0,0.55);backdrop-filter:blur(12px);border:1.5px solid rgba(255,255,255,0.2);border-radius:30px;color:#fff;font-size:15px;font-weight:700;font-family:inherit;padding:11px 32px;cursor:pointer;display:flex;align-items:center;gap:8px;letter-spacing:0.2px;}
.vp-close-btn svg{width:16px;height:16px;stroke:#fff;stroke-width:2.5;fill:none;}
.vp-close-btn:active{background:rgba(0,0,0,0.75);}
</style>
</head>
<body>

<!-- LOADING -->
<div id="loadingScreen">
  <div class="loader-ring"></div>
  <div class="loader-text">Loading...</div>
</div>

<!-- ERROR -->
<div id="errorScreen">
  <div class="error-emoji">⚠️</div>
  <div class="error-title">Video Not Found</div>
  <div class="error-sub">This link is invalid or the video has been removed.</div>
</div>

<!-- MAIN SCREEN -->
<div id="mainScreen">

  <div class="thumb-wrap">
    <img id="thumbImg" src="" alt="">
    <div class="thumb-overlay"></div>
    <div class="play-btn-overlay">
      <svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>
    </div>
    <div class="duration-pill">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <span id="durationPill">0:00</span>
    </div>
  </div>

  <div class="info-card">
    <div class="video-title" id="videoTitle">Loading...</div>
    <div class="meta-row">
      <div class="meta-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        <span id="viewsText">—</span>
      </div>
      <div class="meta-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span id="durationMeta">—</span>
      </div>
    </div>
  </div>

  <div class="unlock-card" id="unlockSection">
    <div class="unlock-steps">
      <div class="step-dot" id="dot1"></div>
      <div class="step-dot" id="dot2"></div>
      <div class="step-dot" id="dot3"></div>
      <div class="step-dot" id="dot4"></div>
    </div>
    <div class="unlock-icon" id="unlockIcon">🔐</div>
    <div class="unlock-title" id="unlockTitle">Unlock to Watch</div>
    <div class="unlock-sub" id="unlockSub">Watch 4 short ads to unlock the video for free.</div>
    <div class="status-badge" id="statusBadge"><span id="statusText"></span></div>
    <button class="btn-unlock" id="unlockBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="18" height="18">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
      <span>Watch Ad 1 of 4</span>
    </button>
  </div>

  <div class="close-card">
    <button class="btn-close-app" onclick="window.close()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="18" height="18">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
      Close
    </button>
  </div>
</div>

<!-- FULLSCREEN PLAYER -->
<div id="playerScreen">
  <video id="mainVideo" playsinline preload="auto"></video>
  <div class="vp-spinner" id="vpSpinner"></div>
  <div class="vp-tap" onclick="tapToggle()"></div>
  <div class="vp-overlay" id="vpOverlay">
    <div class="vp-seek-area">
      <div class="vp-seek-track" id="seekTrack">
        <div class="vp-seek-fill" id="seekFill"></div>
        <div class="vp-seek-thumb" id="seekThumb"></div>
      </div>
      <div class="vp-time-row">
        <span id="vpCurrent">0:00</span>
        <span id="vpDuration">0:00</span>
      </div>
    </div>
    <div class="vp-center">
      <button class="vp-play-btn" id="vpPlayBtn" onclick="togglePlay()">
        <svg viewBox="0 0 24 24" id="vpPlayIcon"><polygon points="5,3 19,12 5,21"/></svg>
      </button>
    </div>
    <div style="height:80px;"></div>
  </div>
  <div class="vp-close-wrap">
    <button class="vp-close-btn" onclick="closePlayer()">
      <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      Close
    </button>
  </div>
</div>

<script>
const API_BASE = "https://checking-g169.onrender.com";
const TOTAL_ADS = 4;

/* ═══════════════════════════════
   AD LINKS — same pool as lock page
═══════════════════════════════ */
const _ADS = [
  "https://www.profitablecpmratenetwork.com/qz84e0h8y?key=2029482c6ef0c2147c966281ae64d915",
  "https://www.profitablecpmratenetwork.com/hzm7yr4w3x?key=caecfa9ec112acd23158b9e50631e07d",
  "https://omg10.com/4/10947779",
  "https://www.profitablecpmratenetwork.com/jvu5a7ng?key=ba1501f601cda393d057af55c53dfd50",
  "https://www.profitablecpmratenetwork.com/siimnpstrx?key=a7ce4652c96aa91daa6ff10d1bf94807",
  "https://omg10.com/4/10947782",
  "https://www.profitablecpmratenetwork.com/wrwng7eiq7?key=456a55bb6bc3c846214acd667b23c1d4",
  "https://www.profitablecpmratenetwork.com/sgri5heh?key=f7a9e6a818a1761f55964b9551142aa9",
  "https://omg10.com/4/10947773",
  "https://www.profitablecpmratenetwork.com/zqr3q9tp?key=34434aef756933ad6315f8ad477926da",
];
const _adsterra = _ADS.filter(l => l.includes('profitablecpmratenetwork'));
const _monetag  = _ADS.filter(l => l.includes('omg10'));
let _adPool = [];

function _refill() {
  const w = [..._adsterra, ..._adsterra, ..._monetag];
  for (let i = w.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [w[i], w[j]] = [w[j], w[i]];
  }
  _adPool = w;
}
_refill();
function nextAd() { if (!_adPool.length) _refill(); return _adPool.pop(); }

/* ═══════════════════════════════
   STORAGE — persist step count
   so returning from ad tab resumes
═══════════════════════════════ */
let _mem = {};
function lsGet(k, fb) { try { const v = localStorage.getItem(k); return v === null ? fb : v; } catch { return k in _mem ? _mem[k] : fb; } }
function lsSet(k, v)  { try { localStorage.setItem(k, v); } catch { _mem[k] = v; } }

/* ═══════════════════════════════
   STATE
═══════════════════════════════ */
let videoId   = null;
let adStep    = 0;   // 0–4; 4 = fully unlocked
let _busy     = false;
let ctrlTimer = null;
let isSeeking = false;

/* ═══════════════════════════════
   INIT
═══════════════════════════════ */
window.addEventListener('load', async () => {
  const p = new URLSearchParams(window.location.search);
  videoId = p.get('startapp') || p.get('id') || null;
  if (!videoId) { showError(); return; }

  // restore step from storage (user returned from ad tab)
  const saved = lsGet('adStep_' + videoId, '0');
  adStep = parseInt(saved) || 0;

  await loadVideo();
});

async function loadVideo() {
  try {
    const r = await fetch(`${API_BASE}/api/video?id=${videoId}`);
    if (!r.ok) throw 0;
    const d = await r.json();
    document.getElementById('thumbImg').src             = d.thumbnail || '';
    document.getElementById('videoTitle').textContent   = d.title     || 'Untitled';
    document.getElementById('durationPill').textContent = d.duration  || '—';
    document.getElementById('durationMeta').textContent = d.duration  || '—';
    document.getElementById('viewsText').textContent    = d.views ? d.views + ' views' : '—';
    document.getElementById('mainScreen').style.display = 'block';

    // if already fully unlocked (returned after all ads), go straight to video
    if (adStep >= TOTAL_ADS) {
      updateUI();
      hideLoading();
      fetchAndPlay();
      return;
    }

    updateUI();
    hideLoading();
  } catch { showError(); }
}

/* ═══════════════════════════════
   UNLOCK UI
═══════════════════════════════ */
function updateUI() {
  for (let i = 0; i < TOTAL_ADS; i++) {
    const el = document.getElementById('dot' + (i + 1));
    el.className = i < adStep ? 'step-dot done' : i === adStep ? 'step-dot active' : 'step-dot';
  }
  const btn = document.getElementById('unlockBtn');
  btn.disabled = false;
  btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="18" height="18"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><span>Watch Ad ${adStep + 1} of ${TOTAL_ADS}</span>`;
  document.getElementById('unlockIcon').textContent  = adStep > 0 ? '🔓' : '🔐';
  document.getElementById('unlockTitle').textContent = adStep > 0 ? `Step ${adStep + 1} of ${TOTAL_ADS}` : 'Unlock to Watch';
  document.getElementById('unlockSub').textContent   = adStep > 0
    ? `${TOTAL_ADS - adStep} more step${TOTAL_ADS - adStep > 1 ? 's' : ''} remaining.`
    : `Watch ${TOTAL_ADS} short ads to unlock the video for free.`;
}

function showStatus(type, msg) {
  const el = document.getElementById('statusBadge');
  el.className = 'status-badge ' + type;
  document.getElementById('statusText').textContent = msg;
  el.style.display = 'flex';
}
function hideStatus() { document.getElementById('statusBadge').style.display = 'none'; }

/* ═══════════════════════════════
   UNLOCK BUTTON — exact lock-page pattern:
   tap → open same page in new tab
        → current tab redirects to ad
   on return: adStep already incremented in storage
═══════════════════════════════ */
document.getElementById('unlockBtn').onclick = function () {
  if (_busy) return;
  _busy = true;
  hideStatus();

  adStep++;
  lsSet('adStep_' + videoId, adStep);

  if (adStep < TOTAL_ADS) {
    // not done yet — open this page again in new tab, then redirect current tab to ad
    window.open(location.href, '_blank');
    setTimeout(() => {
      _busy = false;
      location.href = nextAd();
    }, 15);

  } else {
    // last step — all ads done
    for (let i = 0; i < TOTAL_ADS; i++) document.getElementById('dot' + (i + 1)).className = 'step-dot done';
    showStatus('success', '🎉 Unlocked! Loading video...');
    document.getElementById('unlockBtn').style.display  = 'none';
    document.getElementById('unlockIcon').textContent   = '🎬';
    document.getElementById('unlockTitle').textContent  = 'Access Granted!';
    document.getElementById('unlockSub').textContent    = 'Your video is loading...';

    // redirect current tab to ad, then after a moment fetch the video
    // (user returns to see the player already loading)
    setTimeout(() => {
      location.href = nextAd();
    }, 15);

    // store a flag so when user returns this page auto-plays
    lsSet('adDone_' + videoId, '1');
    // note: fetchAndPlay() is called on load if adStep >= TOTAL_ADS (already handled above)
  }
};

/* ═══════════════════════════════
   FETCH & PLAY
═══════════════════════════════ */
async function fetchAndPlay() {
  showStatus('success', '🎬 Loading video...');
  document.getElementById('unlockBtn').style.display  = 'none';
  document.getElementById('unlockIcon').textContent   = '🎬';
  document.getElementById('unlockTitle').textContent  = 'Access Granted!';
  document.getElementById('unlockSub').textContent    = 'Your video is loading...';
  try {
    const r = await fetch(`${API_BASE}/api/unlock`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ videoId })
    });
    if (!r.ok) throw 0;
    const d = await r.json();
    if (!d.playbackUrl) throw 0;
    openPlayer(d.playbackUrl);
  } catch {
    showStatus('error', '❌ Failed to load. Tap to retry.');
    document.getElementById('statusBadge').style.cursor = 'pointer';
    document.getElementById('statusBadge').onclick = fetchAndPlay;
  }
}

/* ═══════════════════════════════
   PLAYER
═══════════════════════════════ */
function openPlayer(url) {
  const v = document.getElementById('mainVideo');
  v.src = url;
  document.getElementById('mainScreen').style.display   = 'none';
  document.getElementById('playerScreen').style.display = 'flex';
  v.addEventListener('waiting',        () => spinner(true));
  v.addEventListener('playing',        () => spinner(false));
  v.addEventListener('canplay',        () => spinner(false));
  v.addEventListener('timeupdate',     onTimeUpdate);
  v.addEventListener('loadedmetadata', () => {
    document.getElementById('vpDuration').textContent = fmt(v.duration);
    v.play().catch(() => {});
    showOverlay();
  });
  v.addEventListener('ended', () => setIcon('play'));
  v.addEventListener('pause', () => setIcon('play'));
  v.addEventListener('play',  () => setIcon('pause'));
  setupSeek();
}
function spinner(on) { document.getElementById('vpSpinner').style.display = on ? 'block' : 'none'; }
function tapToggle() { const ov = document.getElementById('vpOverlay'); ov.classList.contains('visible') ? hideOverlay() : showOverlay(); }
function showOverlay() { const ov = document.getElementById('vpOverlay'); ov.classList.add('visible'); clearTimeout(ctrlTimer); if (!document.getElementById('mainVideo').paused) ctrlTimer = setTimeout(hideOverlay, 3000); }
function hideOverlay() { document.getElementById('vpOverlay').classList.remove('visible'); }
function togglePlay() { const v = document.getElementById('mainVideo'); clearTimeout(ctrlTimer); if (v.paused) { v.play(); ctrlTimer = setTimeout(hideOverlay, 2500); } else { v.pause(); showOverlay(); } }
function setIcon(state) {
  const ico = document.getElementById('vpPlayIcon');
  const btn = document.getElementById('vpPlayBtn');
  if (state === 'pause') { ico.innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>'; btn.classList.add('pause'); }
  else { ico.innerHTML = '<polygon points="5,3 19,12 5,21"/>'; btn.classList.remove('pause'); }
}
function onTimeUpdate() {
  const v = document.getElementById('mainVideo');
  if (isSeeking || !v.duration) return;
  const p = v.currentTime / v.duration;
  document.getElementById('seekFill').style.width  = (p * 100) + '%';
  document.getElementById('seekThumb').style.left  = (p * 100) + '%';
  document.getElementById('vpCurrent').textContent = fmt(v.currentTime);
}
function setupSeek() {
  const track = document.getElementById('seekTrack');
  const doSeek = e => {
    const v = document.getElementById('mainVideo');
    if (!v.duration) return;
    const rect = track.getBoundingClientRect();
    const cx   = e.touches ? e.touches[0].clientX : e.clientX;
    const pct  = Math.max(0, Math.min(1, (cx - rect.left) / rect.width));
    v.currentTime = pct * v.duration;
    document.getElementById('seekFill').style.width = (pct * 100) + '%';
    document.getElementById('seekThumb').style.left  = (pct * 100) + '%';
  };
  track.addEventListener('mousedown',  e => { isSeeking = true; doSeek(e); });
  track.addEventListener('mousemove',  e => { if (isSeeking) doSeek(e); });
  track.addEventListener('mouseup',    () => isSeeking = false);
  track.addEventListener('touchstart', e => { isSeeking = true; doSeek(e); clearTimeout(ctrlTimer); }, {passive:true});
  track.addEventListener('touchmove',  e => { if (isSeeking) doSeek(e); }, {passive:true});
  track.addEventListener('touchend',   () => { isSeeking = false; ctrlTimer = setTimeout(hideOverlay, 2500); });
}
function closePlayer() { const v = document.getElementById('mainVideo'); v.pause(); v.src = ''; document.getElementById('playerScreen').style.display = 'none'; document.getElementById('mainScreen').style.display = 'block'; }

function fmt(s) { if (!s || isNaN(s)) return '0:00'; const m = Math.floor(s / 60), sec = Math.floor(s % 60); return m + ':' + (sec < 10 ? '0' : '') + sec; }
function hideLoading() { const el = document.getElementById('loadingScreen'); el.style.opacity = '0'; setTimeout(() => el.style.display = 'none', 300); }
function showError() { document.getElementById('loadingScreen').style.display = 'none'; document.getElementById('errorScreen').style.display = 'block'; }

updateUI();
</script>
</body>
</html>
