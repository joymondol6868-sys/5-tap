<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>লক পেজ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0a0f;--accent:#e50914;--text:#f0f0f0;
}
html,body{background:var(--bg);font-family:'Hind Siliguri',sans-serif;color:var(--text);overflow-x:hidden;-webkit-font-smoothing:antialiased}

/* ═══ LOCK PAGE (identical to the main site) ═══ */
#pgLock{display:block;min-height:100vh;background:#000;position:relative;overflow:hidden}
.lock-bg{position:fixed;inset:0;z-index:0;overflow:hidden}
.lock-bg-img{width:100%;height:100%;object-fit:cover;filter:brightness(0.3);transform:scale(1.05)}
.lock-bg-ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0.15) 0%,rgba(0,0,0,0.08) 20%,rgba(0,0,0,0.5) 65%,rgba(0,0,0,0.95) 100%);}
.lock-body{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:30px 20px 90px;text-align:center;}
.lock-circle{width:88px;height:88px;border-radius:50%;background:rgba(229,9,20,0.1);border:2px solid rgba(229,9,20,0.3);display:flex;align-items:center;justify-content:center;margin-bottom:16px;position:relative;box-shadow:0 0 20px rgba(229,9,20,0.15);}
.lock-icon{width:44px;height:44px}
.lock-ripple{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:0;height:0;border-radius:50%;background:rgba(229,9,20,0.25);animation:lockRipple .55s ease-out forwards;pointer-events:none;}
@keyframes lockRipple{0%{width:0;height:0;opacity:1}100%{width:230px;height:230px;opacity:0}}
.lock-title{font-size:18px;font-weight:700;color:#fff;margin-bottom:5px}
.lock-sub{font-size:12px;color:rgba(255,255,255,0.4);margin-bottom:20px}
.step-dots{display:flex;gap:8px;justify-content:center;margin-bottom:16px}
.sdot{width:28px;height:28px;border-radius:50%;border:2px solid rgba(229,9,20,0.2);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:rgba(255,255,255,0.2);background:rgba(255,255,255,0.03);transition:all .2s;}
.sdot.done{background:linear-gradient(135deg,var(--accent),#b20710);border-color:var(--accent);color:#fff;box-shadow:0 0 10px rgba(229,9,20,0.45);transform:scale(1.12);}
.lock-counter{font-size:14px;font-weight:700;color:#fff;background:rgba(0,0,0,0.45);border:1.5px solid rgba(229,9,20,0.3);border-radius:50px;padding:8px 22px;margin-bottom:20px;}
.unlock-btn{background:linear-gradient(135deg,var(--accent),#b20710);color:#fff;border:none;padding:14px 52px;font-size:18px;font-weight:700;border-radius:50px;cursor:pointer;font-family:'Hind Siliguri',sans-serif;box-shadow:0 6px 24px rgba(229,9,20,0.5);display:flex;align-items:center;gap:8px;-webkit-tap-highlight-color:transparent;}
.unlock-btn:active{transform:scale(0.96)}
.unlock-btn svg{width:18px;height:18px;flex-shrink:0}
.lock-movie-bar{position:fixed;bottom:0;left:0;right:0;z-index:10;padding:10px 16px 14px;background:rgba(0,0,0,0.8);backdrop-filter:blur(10px);border-top:1px solid rgba(229,9,20,0.12);font-size:12px;font-weight:600;color:#ccc;text-align:center;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
@keyframes popIcon{0%{transform:scale(1) rotate(0)}35%{transform:scale(1.25) rotate(-10deg)}65%{transform:scale(.9) rotate(5deg)}100%{transform:scale(1) rotate(0)}}
</style>
</head>
<body>

<div id="pgLock"></div>

<script>
/* ═══════════════════════════════════════════════
   CONFIG — edit these, or pass as URL params:
   ?target=https://example.com/final-page
   &title=তোমার টাইটেল
   &thumb=https://example.com/image.jpg
   &id=any-unique-id   (used to key the counter per item)
════════════════════════════════════════════════ */
const _params   = new URLSearchParams(location.search);
const TARGET_URL = _params.get('target') || 'https://example.com'; // <-- where user goes after unlocking
const PAGE_TITLE = _params.get('title')  || 'কন্টেন্ট লক করা আছে';
const THUMB_URL  = _params.get('thumb')  || '';
const ITEM_ID    = _params.get('id')     || 'default';
const TOTAL      = 5; // number of unlock taps required

/* ═══════════════════════════════════════════════
   AD LINKS — replace with your own ad links
════════════════════════════════════════════════ */
const _ADS=[
  "https://www.profitablecpmratenetwork.com/qz84e0h8y?key=2029482c6ef0c2147c966281ae64d915",
  "https://www.profitablecpmratenetwork.com/hzm7yr4w3x?key=caecfa9ec112acd23158b9e50631e07d",
  "https://omg10.com/4/10947779",
  "https://www.profitablecpmratenetwork.com/jvu5a7ng?key=ba1501f601cda393d057af55c53dfd50",
  "https://www.profitablecpmratenetwork.com/siimnpstrx?key=a7ce4652c96aa91daa6ff10d1bf94807",
  "https://omg10.com/4/10947782",
  "https://www.profitablecpmratenetwork.com/wrwng7eiq7?key=456a55bb6bc3c846214acd667b23c1d4",
  "https://www.profitablecpmratenetwork.com/sgri5heh?key=f7a9e6a818a1761f55964b9551142aa9",
  "https://omg10.com/4/10947773",
  "https://www.profitablecpmratenetwork.com/zqr3q9tp?key=34434aef756933ad6315f8ad477926da",
];
const _adsterra=_ADS.filter(l=>l.includes('profitablecpmratenetwork'));
const _monetag=_ADS.filter(l=>l.includes('omg10'));
let _adPool=[];
function _refill(){
  const w=[..._adsterra,..._adsterra,..._monetag];
  for(let i=w.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[w[i],w[j]]=[w[j],w[i]];}
  _adPool=w;
}
_refill();
function nextAd(){if(!_adPool.length)_refill();return _adPool.pop();}
let _adBusy=false;
function triggerAd(){
  if(_adBusy)return;_adBusy=true;
  setTimeout(()=>{_adBusy=false;location.href=nextAd();},60);
}

/* ═══════════════════════════════════════════════
   ROBUST STORAGE HELPER
   Uses localStorage (survives tab/session resets in
   Telegram's in-app browser etc.) with an in-memory
   fallback if storage is blocked entirely.
════════════════════════════════════════════════ */
let _memStore={};
function lsGet(key,fallback){
  try{
    const v=localStorage.getItem(key);
    return v===null?fallback:v;
  }catch(e){
    return key in _memStore?_memStore[key]:fallback;
  }
}
function lsSet(key,val){
  try{
    localStorage.setItem(key,val);
  }catch(e){
    _memStore[key]=val;
  }
}

/* ═══════════════════════════════════════════════
   BENGALI DIGIT HELPER
════════════════════════════════════════════════ */
const BN_DIGITS=['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
function toBn(n){return String(n).split('').map(d=>BN_DIGITS[+d]??d).join('');}

/* ═══════════════════════════════════════════════
   LOCK PAGE
════════════════════════════════════════════════ */
function initLockPage(){
  const pg=document.getElementById('pgLock');

  // Key the counter to ITEM_ID so different items don't share/confuse counts.
  if(lsGet('lockItemId','')!==ITEM_ID){
    lsSet('lockRemain','5');
    lsSet('lockItemId',ITEM_ID);
  }
  let remaining=parseInt(lsGet('lockRemain','5'));

  const LOCK_SVG=`<svg class="lock-icon" viewBox="0 0 24 24" fill="none"><rect x="5" y="11" width="14" height="10" rx="2" fill="#e50914" opacity=".9"/><path d="M8 11V7a4 4 0 0 1 8 0v4" stroke="#e50914" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="16" r="1.5" fill="#fff"/></svg>`;
  const UNLOCK_SVG=`<svg class="lock-icon" viewBox="0 0 24 24" fill="none" style="animation:popIcon .5s ease"><rect x="5" y="11" width="14" height="10" rx="2" fill="#22c55e" opacity=".9"/><path d="M8 11V7a4 4 0 0 1 7.42-1.5" stroke="#22c55e" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="16" r="1.5" fill="#fff"/></svg>`;

  pg.innerHTML=`
    <div class="lock-bg">
      ${THUMB_URL?`<img class="lock-bg-img" src="${THUMB_URL}" alt="">`:'<div style="width:100%;height:100%;background:#0d0d1a"></div>'}
      <div class="lock-bg-ov"></div>
    </div>
    <div class="lock-body">
      <div class="lock-circle" id="lockCircle">${LOCK_SVG}</div>
      <div class="lock-title">ভিডিওটি লক করা আছে</div>
      <div class="lock-sub">নিচের বাটনে চাপ দিয়ে লক খুলুন</div>
      <div class="step-dots" id="stepDots"></div>
      <div class="lock-counter" id="lockCounter">${toBn(remaining)} বার বাটনে চাপুন</div>
      <button class="unlock-btn" id="unlockBtn">
        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.42-1.5" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
        আনলক করুন
      </button>
    </div>
    <div class="lock-movie-bar">${PAGE_TITLE}</div>
  `;

  function renderDots(){
    const done=TOTAL-remaining;
    const row=document.getElementById('stepDots');
    row.innerHTML='';
    for(let i=1;i<=TOTAL;i++){
      const d=document.createElement('div');
      d.className='sdot'+(i<=done?' done':'');
      d.textContent=toBn(i);
      row.appendChild(d);
    }
  }
  renderDots();

  function doRipple(){
    const c=document.getElementById('lockCircle');
    const r=document.createElement('div');r.className='lock-ripple';
    c.appendChild(r);setTimeout(()=>r.remove(),600);
  }

  let _busy=false;
  document.getElementById('unlockBtn').onclick=function(){
    if(_busy)return;_busy=true;
    remaining--;
    lsSet('lockRemain',remaining);
    doRipple();
    if(remaining<=0){
      document.getElementById('lockCircle').innerHTML=UNLOCK_SVG;
      document.querySelectorAll('.sdot').forEach(d=>d.classList.add('done'));
      document.getElementById('lockCounter').textContent='আনলক হয়ে গেছে!';
      this.disabled=true;this.style.opacity='.35';
      setTimeout(()=>{ location.href=TARGET_URL; },700);
    }else{
      renderDots();
      document.getElementById('lockCounter').textContent=toBn(remaining)+' বার বাকি আছে!';
      // Match the main site's 5-tap unlock flow:
      // open the next lock step in a new tab, then trigger the ad
      // from the current tab.
      window.open(location.href,'_blank');
      setTimeout(()=>{
        _busy=false;
        location.href=nextAd();
      },15);
    }
  };
}

/* ═══════════════════════════════════════════════
   ENTRY POINT — call this from wherever a user
   should land on the lock page, e.g.:
   openLockTab('some-unique-id', 'https://target.com', 'শিরোনাম', 'thumb.jpg')
════════════════════════════════════════════════ */
function openLockTab(itemId,targetUrl,title,thumb){
  lsSet('lockRemain','5');
  lsSet('lockItemId',itemId);
  const u=location.origin+location.pathname
    +'?id='+encodeURIComponent(itemId)
    +'&target='+encodeURIComponent(targetUrl)
    +'&title='+encodeURIComponent(title||'')
    +'&thumb='+encodeURIComponent(thumb||'');
  window.open(u,'_blank');
  triggerAd();
}

initLockPage();
</script>
</body>
</html>
