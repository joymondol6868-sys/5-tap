<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Watch</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!-- Adsgram SDK — preload করা হচ্ছে যাতে দ্রুত load হয় -->
<script async src="https://sad.adsgram.ai/js/sad.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#f2f2f7;
  --card:#fff;
  --accent:#007aff;
  --accent2:#5856d6;
  --text:#1c1c1e;
  --sub:#6d6d72;
  --border:#e5e5ea;
  --green:#34c759;
  --radius:16px;
}
body{
  font-family:-apple-system,'SF Pro Display','Segoe UI',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
}

/* ── SPINNER ANIMATION ───────────────────── */
@keyframes spin{to{transform:rotate(360deg);}}

/* ── LOADING SCREEN ──────────────────────── */
#loadingScreen{
  position:fixed;inset:0;
  background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;z-index:999;transition:opacity 0.3s;
}
.loader-ring{
  width:44px;height:44px;
  border:3px solid var(--border);
  border-top-color:var(--accent);
  border-radius:50%;
  animation:spin 0.8s linear infinite;
}
.loader-text{font-size:14px;color:var(--sub);font-weight:500;}

/* ── ERROR SCREEN ────────────────────────── */
#errorScreen{display:none;padding:60px 24px;text-align:center;}
.error-emoji{font-size:52px;margin-bottom:16px;}
.error-title{font-size:18px;font-weight:700;margin-bottom:8px;}
.error-sub{font-size:14px;color:var(--sub);line-height:1.5;}

/* ── MAIN SCREEN ─────────────────────────── */
#mainScreen{display:none;padding-bottom:30px;}

/* ── THUMBNAIL ───────────────────────────── */
.thumb-wrap{
  position:relative;width:100%;aspect-ratio:16/9;
  background:#000;overflow:hidden;
}
.thumb-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
.thumb-overlay{
  position:absolute;inset:0;
  background:linear-gradient(to bottom,transparent 40%,rgba(0,0,0,0.65) 100%);
}
.play-btn-overlay{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:64px;height:64px;
  background:rgba(255,255,255,0.2);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  border:2px solid rgba(255,255,255,0.5);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;
}
.play-btn-overlay svg{width:28px;height:28px;fill:white;margin-left:4px;}
.duration-pill{
  position:absolute;bottom:12px;right:12px;
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  color:#fff;font-size:12px;font-weight:600;
  padding:4px 10px;border-radius:20px;
  display:flex;align-items:center;gap:5px;
}

/* ── INFO CARD ───────────────────────────── */
.info-card{
  background:var(--card);
  margin:12px 12px 10px;
  border-radius:var(--radius);
  padding:16px;
  box-shadow:0 2px 12px rgba(0,0,0,0.07);
}
.video-title{font-size:16px;font-weight:700;line-height:1.35;margin-bottom:10px;}
.meta-row{display:flex;gap:14px;flex-wrap:wrap;}
.meta-item{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--sub);font-weight:500;}
.meta-item svg{width:13px;height:13px;flex-shrink:0;}

/* ── UNLOCK CARD ─────────────────────────── */
.unlock-card{
  background:var(--card);
  margin:0 12px 10px;
  border-radius:var(--radius);
  padding:22px 18px;
  box-shadow:0 2px 12px rgba(0,0,0,0.07);
  text-align:center;
}
.unlock-steps{
  display:flex;align-items:center;justify-content:center;
  gap:8px;margin-bottom:18px;
}
.step-dot{
  width:28px;height:6px;
  border-radius:3px;
  background:var(--border);
  transition:background 0.35s,transform 0.2s;
}
.step-dot.active{background:var(--accent);transform:scaleY(1.3);}
.step-dot.done{background:var(--green);}

.unlock-icon{
  width:56px;height:56px;
  background:linear-gradient(135deg,#007aff,#5856d6);
  border-radius:16px;
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 14px;font-size:26px;
  transition:transform 0.3s;
}
.unlock-title{font-size:17px;font-weight:700;color:var(--text);margin-bottom:6px;}
.unlock-sub{font-size:13px;color:var(--sub);line-height:1.5;margin-bottom:20px;}

.status-badge{
  display:none;
  align-items:center;justify-content:center;gap:6px;
  border-radius:10px;padding:10px 14px;
  font-size:13px;font-weight:600;margin-bottom:16px;
}
.status-badge.error{
  background:rgba(255,59,48,0.1);
  border:1px solid rgba(255,59,48,0.25);
  color:#ff3b30;
}

/* ── UNLOCK BUTTON ───────────────────────── */
.btn-unlock{
  width:100%;padding:15px;
  background:linear-gradient(135deg,#007aff,#5856d6);
  border:none;border-radius:13px;
  color:#fff;font-size:15px;font-weight:700;
  font-family:inherit;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 4px 18px rgba(0,122,255,0.3);
  transition:opacity 0.2s,transform 0.1s;
}
.btn-unlock:active{opacity:0.85;transform:scale(0.98);}
.btn-unlock:disabled{opacity:0.65;cursor:not-allowed;transform:none;}

/* small spinner inside button */
.spin-sm{
  width:16px;height:16px;
  border:2px solid rgba(255,255,255,0.35);
  border-top-color:#fff;
  border-radius:50%;
  animation:spin 0.7s linear infinite;
  flex-shrink:0;
}

/* ── CLOSE BUTTON (main screen) ──────────── */
.close-card{margin:0 12px 10px;}
.btn-close-app{
  width:100%;padding:14px;
  background:var(--card);
  border:1.5px solid var(--border);
  border-radius:13px;
  color:var(--text);font-size:15px;font-weight:600;
  font-family:inherit;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 2px 12px rgba(0,0,0,0.07);
}
.btn-close-app:active{background:var(--border);}

/* ══════════════════════════════════════════
   FULLSCREEN VIDEO PLAYER
══════════════════════════════════════════ */
#playerScreen{
  display:none;
  position:fixed;
  inset:0;
  background:#000;
  z-index:500;
}

/* Native <video> — fills the screen */
#mainVideo{
  width:100%;
  height:100%;
  display:block;
  object-fit:contain;
  background:#000;
}

/* Close button — top-left, little space */
#closeBtn{
  position:absolute;
  top:16px;
  left:16px;
  z-index:600;
  width:40px;
  height:40px;
  background:rgba(0,0,0,0.55);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border:1.5px solid rgba(255,255,255,0.22);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  padding:0;
  transition:background 0.15s;
}
#closeBtn svg{
  width:16px;height:16px;
  stroke:#fff;stroke-width:2.5;
  stroke-linecap:round;
  fill:none;
}
#closeBtn:active{background:rgba(255,255,255,0.18);}
</style>
</head>
<body>

<!-- ── LOADING ── -->
<div id="loadingScreen">
  <div class="loader-ring"></div>
  <div class="loader-text">Loading...</div>
</div>

<!-- ── ERROR ── -->
<div id="errorScreen">
  <div class="error-emoji">⚠️</div>
  <div class="error-title">Video Not Found</div>
  <div class="error-sub">This link is invalid or the video has been removed.</div>
</div>

<!-- ── MAIN SCREEN ── -->
<div id="mainScreen">

  <!-- Thumbnail poster -->
  <div class="thumb-wrap">
    <img id="thumbImg" src="" alt="">
    <div class="thumb-overlay"></div>
    <div class="play-btn-overlay">
      <svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>
    </div>
    <div class="duration-pill">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
      </svg>
      <span id="durationPill">0:00</span>
    </div>
  </div>

  <!-- Title + meta -->
  <div class="info-card">
    <div class="video-title" id="videoTitle">Loading...</div>
    <div class="meta-row">
      <div class="meta-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
        <span id="viewsText">—</span>
      </div>
      <div class="meta-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
        </svg>
        <span id="durationMeta">—</span>
      </div>
    </div>
  </div>

  <!-- Unlock card -->
  <div class="unlock-card" id="unlockSection">

    <!-- 4 progress dots -->
    <div class="unlock-steps">
      <div class="step-dot" id="dot1"></div>
      <div class="step-dot" id="dot2"></div>
      <div class="step-dot" id="dot3"></div>
      <div class="step-dot" id="dot4"></div>
    </div>

    <div class="unlock-icon" id="unlockIcon">🔐</div>
    <div class="unlock-title" id="unlockTitle">Unlock to Watch</div>
    <div class="unlock-sub"  id="unlockSub">Tap once — 4 short ads will play automatically to unlock the video for free.</div>

    <div class="status-badge error" id="statusBadge">
      <span id="statusText"></span>
    </div>

    <!-- Single unlock button — user taps ONCE, rest is automatic -->
    <button class="btn-unlock" id="unlockBtn" onclick="startUnlock()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="18" height="18">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
      <span>Unlock Free Access</span>
    </button>
  </div>

  <!-- Close mini app -->
  <div class="close-card">
    <button class="btn-close-app" onclick="closeApp()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="18" height="18">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
      Close
    </button>
  </div>
</div>

<!-- ══════════════════════════════════════════
     FULLSCREEN PLAYER — native HTML5 video
══════════════════════════════════════════ -->
<div id="playerScreen">

  <!-- Close button — top-left, little space from edge -->
  <button id="closeBtn" onclick="closeApp()">
    <svg viewBox="0 0 24 24">
      <line x1="18" y1="6" x2="6" y2="18"/>
      <line x1="6" y1="6" x2="18" y2="18"/>
    </svg>
  </button>

  <!-- Normal MP4 video with native browser controls, fullscreen -->
  <video id="mainVideo" controls playsinline preload="auto"></video>

</div>

<script>
// ══════════════════════════════════════════
//  CONFIG
// ══════════════════════════════════════════
const AD_BLOCKS = ['int-27957', 'int-28749', 'int-27957', 'int-28749'];
const API_BASE  = 'https://checking-g169.onrender.com';

// ══════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════
let videoId = null;
let adBusy  = false;

const delay = ms => new Promise(r => setTimeout(r, ms));
const tg = window.Telegram?.WebApp;
if(tg){ tg.ready(); tg.expand(); }

// ══════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════
window.addEventListener('load', async () => {
  const p = new URLSearchParams(window.location.search);
  videoId = p.get('startapp')
         || p.get('id')
         || tg?.initDataUnsafe?.start_param
         || null;

  if(!videoId){ showError(); return; }
  await loadVideo();
});

// ══════════════════════════════════════════
//  LOAD VIDEO INFO
// ══════════════════════════════════════════
async function loadVideo(){
  try{
    const r = await fetch(`${API_BASE}/api/video?id=${videoId}`);
    if(!r.ok) throw 0;
    const d = await r.json();

    document.getElementById('thumbImg').src             = d.thumbnail || '';
    document.getElementById('videoTitle').textContent   = d.title     || 'Untitled';
    document.getElementById('durationPill').textContent = d.duration  || '—';
    document.getElementById('durationMeta').textContent = d.duration  || '—';
    document.getElementById('viewsText').textContent    = d.views ? d.views + ' views' : '—';

    document.getElementById('mainScreen').style.display = 'block';
    updateDots(0);
    hideLoading();
  }catch{ showError(); }
}

// ══════════════════════════════════════════
//  DOTS UI
// ══════════════════════════════════════════
function updateDots(step){
  for(let i = 0; i < 4; i++){
    const el = document.getElementById('dot' + (i + 1));
    el.className = i < step  ? 'step-dot done'
                 : i === step ? 'step-dot active'
                 : 'step-dot';
  }
}
function setAllDotsDone(){
  for(let i = 1; i <= 4; i++)
    document.getElementById('dot' + i).className = 'step-dot done';
}

// ══════════════════════════════════════════
//  BUTTON HELPERS
// ══════════════════════════════════════════
function setBtnLoading(text){
  const btn = document.getElementById('unlockBtn');
  btn.disabled = true;
  btn.innerHTML = `<div class="spin-sm"></div><span>${text}</span>`;
}
function setBtnReady(text, handler){
  const btn = document.getElementById('unlockBtn');
  btn.disabled = false;
  btn.style.display = '';
  btn.innerHTML = `
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="18" height="18">
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    </svg>
    <span>${text}</span>`;
  btn.onclick = handler || startUnlock;
}
function setBtnHidden(){
  document.getElementById('unlockBtn').style.display = 'none';
}

function showErrBadge(msg){
  const el = document.getElementById('statusBadge');
  document.getElementById('statusText').textContent = msg;
  el.style.display = 'flex';
}
function hideErrBadge(){
  document.getElementById('statusBadge').style.display = 'none';
}

// ══════════════════════════════════════════
//  ADSGRAM — adapted from zip html
// ══════════════════════════════════════════
function waitAdsgramSdk(ms=5000){
  return new Promise((res, rej) => {
    if(window.Adsgram?.init){ res(); return; }
    const end = Date.now() + ms;
    const iv = setInterval(() => {
      if(window.Adsgram?.init){ clearInterval(iv); res(); }
      else if(Date.now() > end){ clearInterval(iv); rej(); }
    }, 80);
  });
}

function _playOnce(blockId){
  return new Promise(resolve => {
    let done = false;
    const g = setTimeout(() => {
      if(!done){ done=true; resolve('timeout'); }
    }, 38000);
    try{
      const ctrl = window.Adsgram.init({ blockId });
      ctrl.show()
        .then(()  => { if(!done){ done=true; clearTimeout(g); resolve('ok'); } })
        .catch(() => { if(!done){ done=true; clearTimeout(g); resolve('skipped'); } });
    }catch(e){ if(!done){ done=true; clearTimeout(g); resolve('fail'); } }
  });
}

async function playAd(blockId){
  let res = await _playOnce(blockId);
  // Retry once on fail/timeout
  if(res === 'fail' || res === 'timeout'){
    await delay(1800);
    res = await _playOnce(blockId);
  }
  return res;
}

// ══════════════════════════════════════════
//  MAIN UNLOCK FLOW — one click, fully auto
// ══════════════════════════════════════════
async function startUnlock(){
  if(adBusy) return;
  adBusy = true;
  hideErrBadge();

  // Phase 1: SDK loading
  setBtnLoading('Preparing...');
  document.getElementById('unlockIcon').textContent  = '⏳';
  document.getElementById('unlockTitle').textContent = 'Connecting...';
  document.getElementById('unlockSub').textContent   = 'Initializing ad system...';

  let sdkReady = false;
  try{ await waitAdsgramSdk(); sdkReady = true; }catch(e){}

  if(sdkReady){
    // Phase 2: Play 4 ads one by one — fully automatic
    for(let i = 0; i < 4; i++){
      updateDots(i);
      setBtnLoading(`Playing Ad ${i + 1} of 4...`);
      document.getElementById('unlockIcon').textContent  = '🎯';
      document.getElementById('unlockTitle').textContent = `Ad ${i + 1} of 4`;
      document.getElementById('unlockSub').textContent   =
        `${4 - i} step${4 - i > 1 ? 's' : ''} remaining — please wait`;

      await playAd(AD_BLOCKS[i]);

      // Brief pause between ads (except after last)
      if(i < 3){
        updateDots(i + 1);
        setBtnLoading('Loading next ad...');
        await delay(500);
      }
    }
  }

  // Phase 3: All ads done
  setAllDotsDone();
  setBtnHidden();
  document.getElementById('unlockIcon').textContent  = '🎬';
  document.getElementById('unlockTitle').textContent = 'Access Granted!';
  document.getElementById('unlockSub').textContent   = 'Loading your video...';

  await delay(600);
  await fetchAndPlay();
}

// ══════════════════════════════════════════
//  FETCH VIDEO URL & OPEN PLAYER
// ══════════════════════════════════════════
async function fetchAndPlay(){
  try{
    const r = await fetch(`${API_BASE}/api/unlock`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ videoId })
    });
    if(!r.ok) throw 0;
    const d = await r.json();
    if(!d.playbackUrl) throw 0;
    openPlayer(d.playbackUrl);
  }catch{
    // Show retry on failure
    document.getElementById('unlockIcon').textContent  = '⚠️';
    document.getElementById('unlockTitle').textContent = 'Failed to Load';
    document.getElementById('unlockSub').textContent   = '';
    showErrBadge('❌ Video failed to load. Tap to retry.');
    setBtnReady('Retry', async () => {
      adBusy = true;
      hideErrBadge();
      setBtnLoading('Retrying...');
      document.getElementById('unlockIcon').textContent  = '🎬';
      document.getElementById('unlockTitle').textContent = 'Loading...';
      document.getElementById('unlockSub').textContent   = 'Please wait';
      await fetchAndPlay();
    });
    adBusy = false;
  }
}

// ══════════════════════════════════════════
//  PLAYER — native <video controls> fullscreen
// ══════════════════════════════════════════
function openPlayer(url){
  const v = document.getElementById('mainVideo');
  v.src = url;

  // Hide main, show fullscreen player
  document.getElementById('mainScreen').style.display   = 'none';
  document.getElementById('playerScreen').style.display = 'block';

  // Auto-play
  v.play().catch(() => {});
  tg?.HapticFeedback?.notificationOccurred('success');
}

// ══════════════════════════════════════════
//  CLOSE APP — works from both screens
// ══════════════════════════════════════════
function closeApp(){
  const v = document.getElementById('mainVideo');
  if(v){ v.pause(); v.src = ''; }
  if(tg) tg.close();
  else window.close();
}

// ══════════════════════════════════════════
//  HELPERS
// ══════════════════════════════════════════
function hideLoading(){
  const el = document.getElementById('loadingScreen');
  el.style.opacity = '0';
  setTimeout(() => el.style.display = 'none', 300);
}
function showError(){
  document.getElementById('loadingScreen').style.display = 'none';
  document.getElementById('errorScreen').style.display  = 'block';
}

// Initialize dots on script load
updateDots(0);
</script>
</body>
</html>
