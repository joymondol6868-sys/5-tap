<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Watch</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

:root{
  --bg:#08080f;
  --s1:#0f0f1a;
  --s2:#15152a;
  --acc:#7c3aed;
  --acc2:#a855f7;
  --acc-glow:rgba(124,58,237,.38);
  --text:#f0efff;
  --muted:#5c5c80;
  --sub:#9090b8;
  --border:rgba(255,255,255,.06);
  --border2:rgba(255,255,255,.1);
  --green:#10b981;
  --red:#ef4444;
  --r:20px;
}
html{background:var(--bg);color:var(--text);font-family:-apple-system,'SF Pro Display','Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
body{min-height:100svh;overflow-x:hidden;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0);}

/* ── LOADING ───────────────────────────────────────────── */
#loadingScreen{
  position:fixed;inset:0;z-index:9999;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
  transition:opacity .5s ease;
}
.ld-logo{
  width:64px;height:64px;border-radius:20px;
  background:linear-gradient(135deg,var(--acc),var(--acc2));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 0 var(--acc-glow);
  animation:lp 2s ease-in-out infinite;
}
.ld-logo svg{width:30px;height:30px;fill:#fff;}
@keyframes lp{
  0%,100%{box-shadow:0 0 0 0 var(--acc-glow);transform:scale(1);}
  50%{box-shadow:0 0 0 16px rgba(124,58,237,0);transform:scale(1.06);}
}
.ld-bar-wrap{width:110px;height:2px;background:var(--border2);border-radius:1px;overflow:hidden;}
.ld-bar{height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:1px;animation:lbar 1.6s ease-in-out infinite;}
@keyframes lbar{0%{width:0%;margin-left:0%;}60%{width:80%;margin-left:20%;}100%{width:0%;margin-left:120%;}}
.ld-txt{font-size:13px;color:var(--muted);letter-spacing:.5px;font-weight:500;}

/* ── ERROR ───────────────────────────────────────────── */
#errorScreen{display:none;min-height:100svh;padding:64px 24px;text-align:center;flex-direction:column;align-items:center;justify-content:center;}
.er-icon{font-size:60px;margin-bottom:20px;}
.er-title{font-size:20px;font-weight:800;margin-bottom:8px;}
.er-sub{font-size:14px;color:var(--sub);line-height:1.65;max-width:260px;}

/* ── MAIN SCREEN ───────────────────────────────────────────── */
#mainScreen{
  display:none;
  padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));
  animation:fadeup .45s ease both;
}
@keyframes fadeup{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}

/* THUMBNAIL */
.thumb-shell{position:relative;width:100%;background:#000;}
.thumb-wrap{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;}
.thumb-wrap img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s ease;}
.thumb-vig{
  position:absolute;inset:0;
  background:linear-gradient(to bottom,rgba(0,0,0,.1) 0%,rgba(0,0,0,0) 30%,rgba(0,0,0,.55) 100%);
  pointer-events:none;
}

/* ── INLINE PREVIEW PLAYER ───────────────────────────── */
.preview-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;display:none}
.preview-video.ready{display:block}
.preview-shade{position:absolute;inset:0;background:rgba(0,0,0,.10);pointer-events:none;opacity:0;transition:opacity .25s}
.preview-shade.show{opacity:1}
.preview-lock{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:20px;background:linear-gradient(180deg,rgba(0,0,0,.18),rgba(0,0,0,.72));backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);z-index:5}
.preview-lock.show{display:flex}
.preview-lock-icon{width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(124,58,237,.92);border:1px solid rgba(255,255,255,.28);box-shadow:0 10px 34px rgba(0,0,0,.45),0 0 28px rgba(124,58,237,.35);margin-bottom:12px}
.preview-lock-icon svg{width:25px;height:25px;stroke:#fff;fill:none;stroke-width:2}
.preview-lock-title{font-size:16px;font-weight:800;color:#fff;margin-bottom:4px}
.preview-lock-sub{font-size:12px;color:rgba(255,255,255,.78)}
.preview-progress{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.14);z-index:6;display:none}
.preview-progress.show{display:block}
.preview-progress>span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));box-shadow:0 0 10px var(--acc-glow)}
.preview-label{position:absolute;top:10px;left:10px;z-index:6;display:none;padding:5px 9px;border-radius:7px;background:rgba(0,0,0,.58);border:1px solid rgba(255,255,255,.12);color:#fff;font-size:10px;font-weight:700;letter-spacing:.3px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.preview-label.show{display:block}

/* play button */
.play-center{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  pointer-events:none;
  display:flex;align-items:center;justify-content:center;
}
.play-disc{
  width:78px;height:78px;border-radius:50%;
  background:rgba(255,255,255,.14);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:2px solid rgba(255,255,255,.28);
  display:flex;align-items:center;justify-content:center;
  position:relative;
  box-shadow:0 8px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.2);
}
.play-disc::before{
  content:'';position:absolute;inset:-7px;border-radius:50%;
  border:1.5px solid rgba(255,255,255,.15);
  animation:pr1 2.8s ease-out infinite;
}
.play-disc::after{
  content:'';position:absolute;inset:-16px;border-radius:50%;
  border:1px solid rgba(255,255,255,.07);
  animation:pr1 2.8s ease-out infinite .55s;
}
@keyframes pr1{0%{transform:scale(1);opacity:.7;}100%{transform:scale(1.55);opacity:0;}}
.play-disc svg{width:30px;height:30px;fill:#fff;margin-left:5px;filter:drop-shadow(0 2px 8px rgba(0,0,0,.4));}
/* duration pill */
.dur-pill{
  position:absolute;bottom:10px;right:10px;
  background:rgba(0,0,0,.72);
  color:#fff;font-size:11px;font-weight:700;
  padding:4px 9px;border-radius:5px;letter-spacing:.2px;
  font-variant-numeric:tabular-nums;
}

/* INFO CARD */
.info-card{
  background:var(--s1);
  padding:15px 16px 13px;
  border-bottom:1px solid var(--border);
}
.vid-title{font-size:15px;font-weight:700;line-height:1.42;color:var(--text);margin-bottom:10px;}
.meta-row{display:flex;gap:18px;align-items:center;}
.meta-item{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--sub);font-weight:500;}
.meta-item svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;flex-shrink:0;}

/* UNLOCK CARD */
.unlock-card{
  margin:14px 14px 10px;
  background:var(--s1);
  border:1px solid var(--border);
  border-radius:var(--r);
  padding:24px 20px 22px;
  position:relative;overflow:hidden;
}
.unlock-card::before{
  content:'';position:absolute;width:240px;height:240px;
  top:-100px;right:-70px;border-radius:50%;
  background:radial-gradient(circle,rgba(124,58,237,.1) 0%,transparent 70%);
  pointer-events:none;
}
.unlock-card::after{
  content:'';position:absolute;width:160px;height:160px;
  bottom:-60px;left:-40px;border-radius:50%;
  background:radial-gradient(circle,rgba(168,85,247,.07) 0%,transparent 70%);
  pointer-events:none;
}

/* progress pips */
.pip-row{display:flex;gap:5px;margin-bottom:22px;position:relative;z-index:1;}
.pip{
  flex:1;height:5px;border-radius:3px;
  background:rgba(255,255,255,.06);
  transition:background .3s,box-shadow .3s;
  position:relative;overflow:hidden;
}
.pip.done{
  background:var(--green);
  box-shadow:0 0 8px rgba(16,185,129,.4);
}
.pip.active{
  background:linear-gradient(90deg,var(--acc),var(--acc2));
  box-shadow:0 0 10px var(--acc-glow);
}
.pip.active::after{
  content:'';position:absolute;top:0;left:-100%;
  width:50%;height:100%;
  background:rgba(255,255,255,.4);
  animation:pipsh 1.4s ease-in-out infinite;
}
@keyframes pipsh{0%{left:-100%;}100%{left:200%;}}

/* icon */
.u-icon{
  width:68px;height:68px;border-radius:19px;
  background:linear-gradient(135deg,var(--acc),var(--acc2));
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 18px;font-size:30px;
  box-shadow:0 12px 32px rgba(124,58,237,.38);
  position:relative;z-index:1;
  transition:transform .25s ease,box-shadow .25s ease;
}
.u-icon.bounce{animation:ibounce .45s ease;}
@keyframes ibounce{
  0%{transform:scale(1);}
  35%{transform:scale(1.22) rotate(-8deg);}
  65%{transform:scale(.92) rotate(5deg);}
  100%{transform:scale(1);}
}
.u-title{font-size:19px;font-weight:800;text-align:center;margin-bottom:7px;position:relative;z-index:1;}
.u-sub{font-size:13px;color:var(--sub);text-align:center;line-height:1.6;margin-bottom:22px;position:relative;z-index:1;}

/* status */
.status-badge{
  display:none;
  align-items:center;justify-content:center;gap:7px;
  border-radius:13px;padding:12px 16px;
  font-size:13px;font-weight:600;margin-bottom:16px;
  position:relative;z-index:1;
}
.status-badge.success{background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.22);color:var(--green);}
.status-badge.error{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.22);color:var(--red);}
.status-badge.show{display:flex;}

/* UNLOCK BUTTON */
.btn-unlock{
  position:relative;overflow:hidden;
  width:100%;padding:17px 20px;
  background:linear-gradient(130deg,var(--acc) 0%,var(--acc2) 100%);
  border:none;border-radius:15px;color:#fff;
  font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:10px;
  box-shadow:0 10px 32px rgba(124,58,237,.45);
  transition:transform .1s ease,box-shadow .15s ease;
  -webkit-appearance:none;letter-spacing:.15px;
  position:relative;z-index:1;
}
/* shimmer sweep */
.btn-unlock::before{
  content:'';position:absolute;top:0;left:-80%;
  width:45%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.16),transparent);
  transform:skewX(-22deg);
  animation:bsh 3s ease-in-out infinite 1.5s;pointer-events:none;
}
@keyframes bsh{0%{left:-80%;}100%{left:160%;}}
.btn-unlock:active:not(:disabled){
  transform:scale(0.965);
  box-shadow:0 4px 14px rgba(124,58,237,.3);
}
.btn-unlock:disabled{opacity:.35;cursor:not-allowed;transform:none !important;box-shadow:none !important;}
.btn-unlock .b-icon{flex-shrink:0;}
/* ripple */
.rpl{
  position:absolute;border-radius:50%;
  background:rgba(255,255,255,.28);
  transform:scale(0);
  animation:rplanim .55s ease-out forwards;
  pointer-events:none;
}
@keyframes rplanim{to{transform:scale(4);opacity:0;}}

/* CLOSE BTN */
.close-wrap{margin:0 14px 10px;}
.btn-close{
  width:100%;padding:14px;background:transparent;
  border:1px solid var(--border);border-radius:15px;
  color:var(--muted);font-size:14px;font-weight:600;
  font-family:inherit;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:background .15s,color .15s,border-color .15s;
}
.btn-close:active{background:rgba(255,255,255,.04);color:var(--sub);border-color:var(--border2);}

/* ── PLAYER ───────────────────────────────────────────── */
#playerScreen{
  display:none;position:fixed;inset:0;z-index:500;
  background:#000;
  align-items:center;justify-content:center;
  animation:pfade .3s ease;
}
@keyframes pfade{from{opacity:0;}to{opacity:1;}}
#mainVideo{
  width:100%;height:100%;
  object-fit:contain;display:block;
  outline:none;
}
/* back button */
.p-back{
  position:absolute;
  top:calc(16px + env(safe-area-inset-top,0px));
  left:16px;
  width:42px;height:42px;
  background:rgba(0,0,0,.52);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.16);
  border-radius:50%;cursor:pointer;z-index:501;
  display:flex;align-items:center;justify-content:center;
  transition:opacity .3s,background .2s;
  opacity:0;
}
#playerScreen:hover .p-back{opacity:1;}
.p-back svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2.5;}
/* mobile: show on touch */
.p-back.visible{opacity:1;}
</style>
</head>
<body>

<!-- LOADING -->
<div id="loadingScreen">
  <div class="ld-logo">
    <svg viewBox="0 0 24 24"><polygon points="6,3 20,12 6,21"/></svg>
  </div>
  <div class="ld-bar-wrap"><div class="ld-bar"></div></div>
  <div class="ld-txt">Loading video…</div>
</div>

<!-- ERROR -->
<div id="errorScreen" style="display:none;">
  <div class="er-icon">🎬</div>
  <div class="er-title">Video Not Found</div>
  <div class="er-sub">This link has expired or the video was removed.</div>
</div>

<!-- MAIN SCREEN -->
<div id="mainScreen">

  <!-- THUMBNAIL -->
  <div class="thumb-shell">
    <div class="thumb-wrap">
      <img id="thumbImg" src="" alt="Thumbnail">
      <video id="previewVideo" class="preview-video" muted playsinline preload="metadata"></video>
      <div class="preview-shade" id="previewShade"></div>
      <div class="preview-label" id="previewLabel">PREVIEW</div>
      <div class="preview-progress" id="previewProgress"><span id="previewProgressBar"></span></div>
      <div class="preview-lock" id="previewLock">
        <div class="preview-lock-icon"><svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></div>
        <div class="preview-lock-title">Unlock to continue watching</div>
        <div class="preview-lock-sub">Preview ended • Unlock below to watch the full video</div>
      </div>
      <div class="thumb-vig"></div>
      <div class="play-center" id="previewPlay">
        <div class="play-disc"><svg viewBox="0 0 24 24"><polygon points="6,3 20,12 6,21"/></svg></div>
      </div>
      <div class="dur-pill" id="durationPill">—</div>
    </div>
  </div>

  <!-- INFO -->
  <div class="info-card">
    <div class="vid-title" id="videoTitle">Loading…</div>
    <div class="meta-row">
      <div class="meta-item">
        <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        <span id="viewsText">—</span>
      </div>
      <div class="meta-item">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span id="durationMeta">—</span>
      </div>
    </div>
  </div>

  <!-- UNLOCK CARD -->
  <div class="unlock-card" id="unlockSection">
    <div class="pip-row" id="pipRow"></div>
    <div class="u-icon" id="unlockIcon">🔐</div>
    <div class="u-title" id="unlockTitle">Unlock to Watch</div>
    <div class="u-sub" id="unlockSub">Tap the button 10 times to unlock the video for free.</div>
    <div class="status-badge" id="statusBadge"><span id="statusText"></span></div>
    <button class="btn-unlock" id="unlockBtn">
      <svg class="b-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="20" height="20">
        <rect x="3" y="11" width="18" height="11" rx="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
      <span id="unlockBtnText">Tap 1 of 10</span>
    </button>
  </div>

  <div class="close-wrap">
    <button class="btn-close" onclick="window.close()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="15" height="15">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
      Close
    </button>
  </div>
</div>

<!-- PLAYER — full screen overlay -->
<div id="playerScreen">
  <video id="mainVideo" controls playsinline preload="auto"
         controlsList="nodownload"
         oncontextmenu="return false"></video>
  <button class="p-back" id="pBackBtn">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
  </button>
</div>

<script>
const API_BASE = "https://checking-g169.onrender.com";
const TOTAL = 10;

/* ── AD POOL ─────────────────────────────── */
const _ADS = [
  "https://www.profitablecpmratenetwork.com/qz84e0h8y?key=2029482c6ef0c2147c966281ae64d915",
  "https://www.profitablecpmratenetwork.com/hzm7yr4w3x?key=caecfa9ec112acd23158b9e50631e07d",
  "https://omg10.com/4/10947779",
  "https://www.profitablecpmratenetwork.com/jvu5a7ng?key=ba1501f601cda393d057af55c53dfd50",
  "https://www.profitablecpmratenetwork.com/siimnpstrx?key=a7ce4652c96aa91daa6ff10d1bf94807",
  "https://omg10.com/4/10947782",
  "https://www.profitablecpmratenetwork.com/wrwng7eiq7?key=456a55bb6bc3c846214acd667b23c1d4",
  "https://www.profitablecpmratenetwork.com/sgri5heh?key=f7a9e6a818a1761f55964b9551142aa9",
  "https://omg10.com/4/10947773",
  "https://www.profitablecpmratenetwork.com/zqr3q9tp?key=34434aef756933ad6315f8ad477926da",
];
const _adsterra = _ADS.filter(l => l.includes('profitablecpmratenetwork'));
const _monetag  = _ADS.filter(l => l.includes('omg10'));
let _pool = [];
function _refill() {
  const w = [..._adsterra, ..._adsterra, ..._monetag];
  for (let i = w.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [w[i], w[j]] = [w[j], w[i]];
  }
  _pool = w;
}
_refill();
function nextAd() { if (!_pool.length) _refill(); return _pool.pop(); }

/* ── STORAGE ─────────────────────────────── */
let _mem = {};
function lsGet(k, fb) { try { const v = localStorage.getItem(k); return v === null ? fb : v; } catch { return k in _mem ? _mem[k] : fb; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch { _mem[k] = v; } }

/* ── STATE ─────────────────────────────── */
let videoId = null, taps = 0, _busy = false;
let previewUrl = '', previewStarted = false, previewLocked = false;
const PREVIEW_SECONDS = 3;

/* ── INIT ─────────────────────────────── */
window.addEventListener('load', async () => {
  const p = new URLSearchParams(window.location.search);
  videoId = p.get('startapp') || p.get('id') || null;
  if (!videoId) { showError(); return; }
  taps = parseInt(lsGet('taps_' + videoId, '0')) || 0;
  await loadVideo();
});

async function loadVideo() {
  try {
    const r = await fetch(`${API_BASE}/api/video?id=${videoId}`);
    if (!r.ok) throw 0;
    const d = await r.json();

    document.getElementById('thumbImg').src            = d.thumbnail || '';
    document.getElementById('videoTitle').textContent  = d.title     || 'Untitled';
    document.getElementById('durationPill').textContent= d.duration  || '—';
    document.getElementById('durationMeta').textContent= d.duration  || '—';
    document.getElementById('viewsText').textContent   = d.views ? fmtViews(d.views) : '—';

    // Preview source can be supplied by the API or by ?video=<MP4 URL>.
    previewUrl = d.previewUrl || d.videoUrl || d.playbackUrl || p.get('video') || '';
    setupPreview(previewUrl);

    if (taps >= TOTAL) {
      renderPips(); hideLoading();
      fetchAndPlay(); return;
    }
    renderPips(); updateBtn();
    document.getElementById('mainScreen').style.display = 'block';
    hideLoading();
  } catch { showError(); }
}

function fmtViews(n) {
  const num = parseInt(n);
  if (isNaN(num)) return n + ' views';
  if (num >= 1e6)  return (num / 1e6).toFixed(1) + 'M views';
  if (num >= 1000) return (num / 1000).toFixed(1) + 'K views';
  return num + ' views';
}


/* ── INLINE PREVIEW ─────────────────────────────── */
function setupPreview(url){
  const v=document.getElementById('previewVideo');
  const play=document.getElementById('previewPlay');
  if(!url || !/^https?:\/\//i.test(url)) return;
  v.src=url; v.load();
  v.addEventListener('loadedmetadata',()=>{
    if(Number.isFinite(v.duration)&&v.duration>0)
      document.getElementById('durationPill').textContent=formatTime(v.duration);
  },{once:true});
  v.addEventListener('timeupdate',()=>{
    if(!previewStarted||previewLocked)return;
    const pct=Math.min(100,(v.currentTime/PREVIEW_SECONDS)*100);
    document.getElementById('previewProgressBar').style.width=pct+'%';
    if(v.currentTime>=PREVIEW_SECONDS)lockPreview();
  });
  v.addEventListener('ended',lockPreview);
  play.addEventListener('click',startPreview,{once:true});
  v.addEventListener('click',()=>{if(!previewStarted)startPreview();});
}
function startPreview(){
  if(previewStarted||previewLocked)return;
  const v=document.getElementById('previewVideo');
  if(!v.src)return;
  previewStarted=true;
  document.getElementById('previewPlay').style.display='none';
  document.getElementById('previewLabel').classList.add('show');
  document.getElementById('previewProgress').classList.add('show');
  v.classList.add('ready');
  const p=v.play();
  if(p&&p.catch)p.catch(()=>{previewStarted=false;document.getElementById('previewPlay').style.display='';});
}
function lockPreview(){
  if(previewLocked)return;
  previewLocked=true;
  const v=document.getElementById('previewVideo');
  v.pause();
  if(Number.isFinite(v.duration))v.currentTime=Math.min(PREVIEW_SECONDS,v.duration);
  document.getElementById('previewShade').classList.add('show');
  document.getElementById('previewLock').classList.add('show');
  document.getElementById('previewProgressBar').style.width='100%';
  const card=document.getElementById('unlockSection');
  if(card)setTimeout(()=>card.scrollIntoView({behavior:'smooth',block:'center'}),120);
}
function formatTime(sec){
  sec=Math.max(0,Math.floor(sec));
  return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');
}

/* ── PIPS ─────────────────────────────── */
function renderPips() {
  const row = document.getElementById('pipRow');
  row.innerHTML = '';
  for (let i = 1; i <= TOTAL; i++) {
    const el = document.createElement('div');
    el.className = 'pip' + (i <= taps ? ' done' : (i === taps + 1 ? ' active' : ''));
    row.appendChild(el);
  }
}

function updateBtn() {
  document.getElementById('unlockIcon').textContent   = taps > 0 ? '🔓' : '🔐';
  document.getElementById('unlockTitle').textContent  = taps > 0 ? `Step ${taps} of ${TOTAL}` : 'Unlock to Watch';
  document.getElementById('unlockSub').textContent    = taps > 0
    ? `${TOTAL - taps} more tap${TOTAL - taps > 1 ? 's' : ''} remaining to unlock this video.`
    : `Tap the button ${TOTAL} times to unlock the video for free.`;
  document.getElementById('unlockBtnText').textContent = `Tap ${taps + 1} of ${TOTAL}`;
  document.getElementById('unlockBtn').disabled = false;
}

function showStatus(type, msg) {
  const el = document.getElementById('statusBadge');
  el.className = 'status-badge show ' + type;
  document.getElementById('statusText').textContent = msg;
}

/* ── UNLOCK BUTTON ─────────────────────────────── */
document.getElementById('unlockBtn').addEventListener('click', function (e) {
  if (_busy) return;

  /* ripple effect */
  const rect = this.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height);
  const x = (e.clientX || rect.left + rect.width / 2) - rect.left - size / 2;
  const y = (e.clientY || rect.top + rect.height / 2) - rect.top - size / 2;
  const rpl = document.createElement('span');
  rpl.className = 'rpl';
  rpl.style.cssText = `width:${size}px;height:${size}px;left:${x}px;top:${y}px;`;
  this.appendChild(rpl);
  setTimeout(() => rpl.remove(), 600);

  /* icon bounce */
  const icon = document.getElementById('unlockIcon');
  icon.classList.remove('bounce');
  void icon.offsetWidth;
  icon.classList.add('bounce');

  _busy = true;
  taps++;
  lsSet('taps_' + videoId, taps);
  renderPips();

  if (taps < TOTAL) {
    window.open(location.href, '_blank');
    setTimeout(() => { _busy = false; location.href = nextAd(); }, 15);
  } else {
    this.disabled = true;
    document.getElementById('unlockIcon').textContent  = '🎬';
    document.getElementById('unlockTitle').textContent = 'Access Granted!';
    document.getElementById('unlockSub').textContent   = 'Your video is loading…';
    this.style.display = 'none';
    showStatus('success', '🎉 Unlocked! Loading your video…');
    setTimeout(() => { _busy = false; fetchAndPlay(); }, 350);
  }
});

/* ── FETCH & PLAY ─────────────────────────────── */
async function fetchAndPlay() {
  document.getElementById('unlockBtn').style.display  = 'none';
  document.getElementById('unlockIcon').textContent   = '🎬';
  document.getElementById('unlockTitle').textContent  = 'Access Granted!';
  document.getElementById('unlockSub').textContent    = 'Your video is loading…';
  showStatus('success', '🎬 Loading video…');
  try {
    const r = await fetch(`${API_BASE}/api/unlock`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ videoId })
    });
    if (!r.ok) throw 0;
    const d = await r.json();
    if (!d.playbackUrl) throw 0;
    lsSet('taps_' + videoId, '0');
    openPlayer(d.playbackUrl);
  } catch {
    showStatus('error', '❌ Failed to load. Tap to retry.');
    const badge = document.getElementById('statusBadge');
    badge.style.cursor = 'pointer';
    badge.onclick = fetchAndPlay;
  }
}

/* ── PLAYER ─────────────────────────────── */
function openPlayer(url) {
  const v = document.getElementById('mainVideo');
  v.src = url;

  document.getElementById('mainScreen').style.display = 'none';
  const ps = document.getElementById('playerScreen');
  ps.style.display = 'flex';

  /* try native fullscreen */
  try {
    if (ps.requestFullscreen)       ps.requestFullscreen();
    else if (ps.webkitRequestFullscreen) ps.webkitRequestFullscreen();
  } catch(_) {}

  v.play().catch(() => {});
}

/* back button */
document.getElementById('pBackBtn').addEventListener('click', () => {
  const v = document.getElementById('mainVideo');
  v.pause(); v.src = '';
  try { if (document.fullscreenElement) document.exitFullscreen(); } catch(_) {}
  document.getElementById('playerScreen').style.display = 'none';
  document.getElementById('mainScreen').style.display = 'block';
});

/* show back btn on touch (mobile) */
let _hideTimer;
document.getElementById('playerScreen').addEventListener('touchstart', function() {
  const btn = document.getElementById('pBackBtn');
  btn.classList.add('visible');
  clearTimeout(_hideTimer);
  _hideTimer = setTimeout(() => btn.classList.remove('visible'), 3200);
}, { passive: true });

/* ── HELPERS ─────────────────────────────── */
function hideLoading() {
  const el = document.getElementById('loadingScreen');
  el.style.opacity = '0';
  setTimeout(() => el.style.display = 'none', 520);
}
function showError() {
  document.getElementById('loadingScreen').style.display = 'none';
  document.getElementById('errorScreen').style.display = 'flex';
}
</script>
